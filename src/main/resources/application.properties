spring.application.name=dedalo

spring.datasource.url=jdbc:postgresql://localhost:5432/dedalo

spring.datasource.username=postgres
spring.datasource.password=admin

spring.datasource.driver-class-name=org.postgresql.Driver

#IMPORTANTE: quando la fase di sviluppo iniziale è comclusa e lo schema DB non va più cambiato, sostituisci create-drop con update. Sennl
#ad ogni esecuzione del programma vai a ricreare da zero le tabella del DB (e perdi i dati che c'erano dentro).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.results=DEBUG

spring.security.user.name=admin
spring.security.user.password=admin

logging.level.org.springframework.security=DEBUG



